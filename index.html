<style>

{font-size:19px;margin:0 0 14px}.sub{color:var(--muted);font-size:14px;line-height:1.6}.match{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-top:1px solid var(--line)}.match strong{display:block}.match small{color:var(--muted)}.badge{color:var(--accent);background:#0a373d;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:var(--panel2);padding:16px;border-radius:12px}.stat b{display:block;font-size:22px;color:var(--accent);margin-top:7px}.stat small{color:var(--muted)}.expert-only{display:none}body.expert .expert-only{display:block}.foot{color:var(--muted);text-align:center;font-size:12px;padding:24px}.empty{padding:16px;border:1px dashed #416078;border-radius:12px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.shell{padding:14px}.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.tools{width:100%}.mode{flex:1}.mode button{flex:1}.grid{grid-template-columns:1fr}.hero{padding:22px}}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.status strong{font-size:14px}.status-note{color:var(--muted);font-size:12px}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}.sports{padding-bottom:9px;margin-bottom:5px}.panel{padding:15px;margin-bottom:12px;border-radius:14px}.panel h2{font-size:17px;margin-bottom:9px}.empty{padding:12px;font-size:14px}.top{padding:4px 0 12px}.brand{font-size:27px}.tagline{font-size:10px}.sport{padding:9px 12px}.mode button,select{padding:9px 10px;font-size:14px}@media(max-width:430px){.shell{padding:12px}.top{gap:9px}.tools{gap:8px}.mode button{padding:8px 6px}.layout{gap:0}.status-note{flex-basis:100%;padding-left:18px}.panel{padding:13px}.panel h2{font-size:16px}}
