<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKNORA - Live Sports</title>
<style>
body {
  margin: 0;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #142238;
  padding: 25px;
  text-align: center;
}
h1 { color: #00e5b0; }
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  padding: 15px;
}
button {
  background: #00e5b0;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}
main {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}
.card {
  background: #18283e;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}
</style>
</head>
<body>
<header>
<h1>VIKNORA</h1>
<p>Global Multisport Intelligence</p>
</header>

<nav>
<button>Fotbal</button>
<button>Baschet</button>
<button>Tenis</button>
<button>Hochei</button>
<button>Alte sporturi</button>
</nav>

<main>
<h2>Scoruri Live</h2>
<div class="card">
<h3>Fotbal</h3>
<p>Meciurile și statisticile vor apărea aici.</p>
</div>
<div class="card">
<h3>Analize sportive</h3>
<p>Mod Simplu | Mod Expert</p>
</div>
</main>
</body>
</html>
